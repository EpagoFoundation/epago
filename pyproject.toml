[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epago"
version = "0.4.0"
description = "Epago — decentralized deep-research model training subnet on Bittensor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Epago Team" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "httpx>=0.27",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "aiosqlite>=0.20",
    "uvicorn>=0.29",
    "fastapi>=0.110",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# bittensor pinned to the 9.x line: v11 is a "lean SDK" rewrite that renamed the
# whole chain API the client uses. async-substrate-interface pinned <2 because 2.x
# dropped ScaleObj (which bittensor 9.x imports) and forces the cyscale codec.
chain = [
    "bittensor>=9.12,<10",
    "async-substrate-interface>=1.5.6,<2",
    "boto3>=1.34",  # object store (no huggingface-hub coupling)
    "pyarrow>=15",  # read the [private_source] parquet feed (HfSnapshotSource)
    "pynacl>=1.5",  # sealed envelopes: upload credentials encrypted to a miner hotkey
]
# Weekly private-holdout harvest (scripts/harvest_holdout.py). Only the party
# that builds the feed needs this; validators read it through `chain`.
holdout = ["pyarrow>=15"]
eval = ["torch>=2.3", "vllm>=0.6", "transformers>=4.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
epago = "epago.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["epago"]

# Chain contracts ship inside the package. Without this an installed validator
# resolves its own genesis contract to a directory that does not exist, which
# is invisible in a source checkout and fatal from a wheel.
[tool.hatch.build.targets.wheel.force-include]
"chains" = "epago/chains"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
